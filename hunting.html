<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff8e9">
    <title>The Right Match | The Phage is Rage</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
    <script src="progression.js" defer></script>
    <script src="hunting.js?v=patient-phage-slides-1" defer></script>
</head>
<body data-scene="hunting" data-requires-level="anatomy">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
        <a class="brand" href="index.html" aria-label="The Phage is Rage home">
            <span class="brand-mark" aria-hidden="true">✦</span>
            <span>The Phage is Rage</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="anatomy.html">Meet a Phage</a>
            <a class="current" href="hunting.html" aria-current="page">The Right Match</a>
            <a href="phage_saviors.html" data-requires-completion="hunting">Phage Hero</a>
            <button class="button button-secondary reset-levels-button" type="button" data-reset-levels>Reset levels</button>
        </nav>
    </header>

    <main id="main-content" class="level-main">
        <a class="back-link" href="index.html"><span aria-hidden="true">←</span> All levels</a>
        <section class="level-hero">
            <div class="game-panel">
                <div class="game-panel-header">
                    <span>Patient-matched phages</span>
                    <span class="game-status">PHOTO STORY</span>
                </div>
                <div class="play-window" id="play-window" role="region" aria-label="Level 2 static photo story"></div>
                <div class="story-interface">
                    <p class="story-progress" id="hunting-progress" hidden></p>
                    <p class="story-caption" id="hunting-caption" aria-live="polite" hidden></p>
                    <p class="story-image-credit" id="hunting-image-credit" hidden>
                        <a id="hunting-image-source" href="" target="_blank" rel="noopener noreferrer"></a>
                        <span id="hunting-image-attribution"></span>
                    </p>
                    <p class="story-image-status" id="hunting-image-status" role="status" hidden></p>
                    <div class="story-controls">
                        <button class="button button-primary" id="hunting-start" type="button">Start slides</button>
                        <button class="button button-secondary" id="hunting-previous" type="button" hidden>Previous</button>
                        <button class="button button-primary" id="hunting-next" type="button" hidden>Next slide</button>
                        <button class="button button-primary" id="hunting-finish" type="button" hidden>Finish level</button>
                    </div>
                </div>
            </div>
        </section>
        <nav class="level-pagination" aria-label="Level navigation">
            <a class="button button-secondary" href="anatomy.html"><span aria-hidden="true">←</span> Previous: Meet a Phage</a>
            <a class="button button-primary" href="phage_saviors.html" data-requires-completion="hunting">Next: Phage Hero <span aria-hidden="true">→</span></a>
        </nav>
    </main>

    <footer class="site-footer">
        <p>Made with curiosity, tiny microbes, and p5.js.</p>
    </footer>

</html>
