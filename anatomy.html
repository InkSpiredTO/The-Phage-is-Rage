<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff8e9">
    <title>Meet a Phage | The Phage is Rage</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
    <script src="progression.js" defer></script>
    <script src="anatomy.js?v=story-order-2" defer></script>
</head>
<body data-scene="anatomy">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
        <a class="brand" href="index.html" aria-label="The Phage is Rage home">
            <span class="brand-mark" aria-hidden="true">✦</span>
            <span>The Phage is Rage</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a class="current" href="anatomy.html" aria-current="page">Meet a Phage</a>
            <a href="hunting.html" data-requires-completion="anatomy">The Right Match</a>
            <a href="phage_saviors.html" data-requires-completion="hunting">Phage Hero</a>
            <button class="button button-secondary reset-levels-button" type="button" data-reset-levels>Reset levels</button>
        </nav>
    </header>

    <main id="main-content" class="level-main">
        <a class="back-link" href="index.html"><span aria-hidden="true">←</span> All levels</a>
        <section class="level-hero">
            <div class="game-panel">
                <div class="game-panel-header">
                    <span>Beach cut story</span>
                    <span class="game-status">STORY MODE</span>
                </div>
                <div class="play-window" id="play-window" role="region" aria-label="Level 1 p5.js play window"></div>
                <div class="story-interface">
                    <p class="story-progress" id="story-progress" hidden></p>
                    <p class="story-caption" id="story-caption" aria-live="polite" hidden></p>
                    <p class="story-image-credit" id="story-image-credit" hidden>
                        <a id="story-image-source" href="" target="_blank" rel="noopener noreferrer"></a>
                        <span id="story-image-attribution"></span>
                    </p>
                    <p class="story-image-status" id="story-image-status" role="status" hidden></p>
                    <fieldset class="phage-game-controls" id="phage-game-controls" hidden>
                        <legend>Choose your phage color</legend>
                        <button class="phage-color-button" type="button" data-phage-color="teal" aria-pressed="true">Green</button>
                        <button class="phage-color-button" type="button" data-phage-color="coral" aria-pressed="false">Pink</button>
                        <button class="phage-color-button" type="button" data-phage-color="purple" aria-pressed="false">Purple</button>
                        <button class="button button-secondary" id="phage-game-restart" type="button" hidden>Play again</button>
                    </fieldset>
                    <p class="phage-game-status" id="phage-game-status" role="status" aria-live="polite" hidden></p>
                    <div class="story-controls">
                        <button class="button button-primary" id="start-story" type="button">Start story ✨</button>
                        <button class="button button-secondary" id="previous-slide" type="button" hidden>Previous</button>
                        <button class="button button-primary" id="next-slide" type="button" hidden>Next scene</button>
                    </div>
                </div>
            </div>
        </section>
        <nav class="level-pagination" aria-label="Level navigation">
            <a class="button button-secondary" href="index.html"><span aria-hidden="true">←</span> All levels</a>
            <a class="button button-primary" href="hunting.html" data-requires-completion="anatomy">Next: The Right Match <span aria-hidden="true">→</span></a>
        </nav>
    </main>

    <footer class="site-footer">
        <p>Made with curiosity, tiny microbes, and p5.js.</p>
    </footer>
</body>
</html>
